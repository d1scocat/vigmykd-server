syntax = "proto3";

package game.network;

message Ack {
    uint32 acknowledged_msg_id = 1;
    bool ok = 2;
}



enum Facing {
    FACING_NEG_X = 0;
    FACING_POS_X = 1;
}

message Position {
    Facing facing = 1;
    float x = 2;
    float y = 3;
}



message PlayerMoveState {
    uint32 client_tick = 1;

    int32 move_dir = 2;
    bool duck = 3;
    bool jump = 4;
    bool dash = 5;
    bool brake_dash = 6;
    bool reverse_dash = 7;
    bool hang = 8;
    bool parry = 9;
    bool gravity_heavy = 10;
    bool gravity_light = 11;
    bool gravity_normal = 12;

    bool punch = 13;
    bool push = 14;
    bool stomp = 15;
}


message RequestMatchInfo {
}

message PlayerData {
    string uuid = 1;
    string name = 2;
    Position position = 3;
}

message ReconcileData {
    string uuid = 1;
    Facing facing = 2;

    float x = 3;
    float vel_x = 4;
    float y = 5;
    float vel_y = 6;

    bool is_grounded = 7;
    bool is_dashing = 8;
    bool is_ducking = 9;

    int32 dash_timer = 10;
    int32 coyote_timer = 11;
    int32 jump_buffer_timer = 12;
    bool last_jump_pressed = 13;
    bool last_dash_pressed = 14;
    int32 hang_timer = 15;
    int32 invulnerable_timer = 16;
    int32 heavy_gravity_timer = 17;
    int32 light_gravity_timer = 18;
    int32 stun_timer = 19;

    int32 brake_dash = 20;
    int32 reverse_dash = 21;
    int32 hang = 22;
    int32 parry = 23;
    int32 heavy = 24;
    int32 light = 25;
    int32 normal = 26;
    int32 push = 27;
    int32 stomp = 28;
    int32 punch = 29;

    int32 combo_hits = 30;
    int32 combo_timer = 31;
    bool combo_broken = 32;

    int32 mana = 33;
    float health = 34;
}

message RequestMatchInfoResponse {
    repeated PlayerData players = 1;
    string your_id = 2;
    uint64 rng_seed = 3;
    uint32 initial_server_tick = 4;
    string map_name = 5;
}

message Reconcile {
    repeated ReconcileData players = 1;
    uint32 server_tick = 2;
    uint32 last_client_tick = 3;
}

message KickedFromMatch {
    string match_id = 1;
    string player_id = 2;
    string reason_i18n = 3;
}

message LostMatch {}
message WonMatch {}



message MatchmakingEnter {
    string match_id = 1;
    string join_token = 2;
}

message MatchmakingEnterResponse {
    string match_id = 1;
}

message MatchmakingQuit {}

message MatchmakingQuitResponse {
    string match_id = 1;
}

message InformMatchStart {}



message ServerToClientPacket {
    // not bound to any id,
    // the packet wrapper handles those
    oneof payload {
        Ack ack = 1;

        Position position = 2;
        MatchmakingEnterResponse matchmaking_enter_response = 3;
        MatchmakingQuitResponse matchmaking_quit_response = 4;
        InformMatchStart inform_match_start = 5;
        RequestMatchInfoResponse request_match_info_response = 6;
        Reconcile reconcile = 7;
        KickedFromMatch kicked_from_match = 8;
        LostMatch lost_match = 9;
        WonMatch won_match = 10;
    }
}

message ClientToServerPacket {
    oneof payload {
        Ack ack = 1;

        PlayerMoveState player_move_state = 2;
        MatchmakingEnter matchmaking_enter = 3;
        MatchmakingQuit matchmaking_quit = 4;
        RequestMatchInfo request_match_info = 5;
    }
}

message InternalCommunicationPacket {
    message PlayerBrief {
        string id = 1;
        string name = 2;
    }

    message RegisterMatch {
        string match_id = 1;
        repeated PlayerBrief players = 2;
        string match_key = 3;
        string join_token = 4;
        uint64 expires = 5;
    }

    message GameOver {
        string won_id = 1;
        string lost_id = 2;
    }

    message RegisterMatchResponse {
        string joined_match_id = 1;
        string old_match_id = 2;
    }

    oneof payload {
        RegisterMatch register_match = 1;
        RegisterMatchResponse register_match_response = 2;
        GameOver game_over = 3;
    }
}

message Packet {
    uint32 msg_id = 1;

    oneof payload {
        ServerToClientPacket server_to_client = 2;
        ClientToServerPacket client_to_server = 3;
        InternalCommunicationPacket icp = 4;
    }
}

message SignedPacket {
    Packet payload = 1;
    bytes signature = 2;
}

message Envelope {
    oneof payload {
        Packet packet = 1;
        SignedPacket signed_packet = 2;
    }
}