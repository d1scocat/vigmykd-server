name: Python CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test (full coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
        
      - name: Cache pip
        uses: actions/cache@v5
        id: cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run flake8
        run: |
          flake8 src tests

      - name: Run tests
        run: pytest tests

      - name: Run mypy
        run: mypy src --check-untyped-defs