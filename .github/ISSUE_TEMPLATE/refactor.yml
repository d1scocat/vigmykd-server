name: Refactor / Cleanup
description: Improve code structure without changing behavior
title: "[REFACTOR] "
labels: ["refactor"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What needs refactoring?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Proposed Changes

  - type: textarea
    id: risks
    attributes:
      label: Risks

  - type: checkboxes
    id: done
    attributes:
      label: Done When
      options:
        - label: Code is cleaner
        - label: No behavior changes
        - label: Tests pass

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/d1scocat/vigmykd-server/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true